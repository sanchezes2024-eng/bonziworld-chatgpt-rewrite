<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Desktop</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
</head>

<body>

<div id="loginScreen">
    <div class="loginBox">
        <div class="loginTitle">Chat Desktop</div>

        <div class="loginLabel">Name:</div>
        <input type="text" id="nameInput" maxlength="24">

        <div class="loginLabel">Room:</div>
        <input type="text" id="roomInput" value="default" maxlength="40">

        <input type="button" id="submitButton" value="Enter Chat">

        <div class="readme">
            <a href="/readme.html">README</a>
        </div>
    </div>
</div>

<div id="desktop">

    <input
        type="button"
        id="settingsButton"
        value="Settings"
    >

    <div id="settingsPanel">
        <div class="settingsTitle">Settings</div>

        <div class="settingsText">
            Text to speech:
            <strong>eSpeak</strong>
        </div>

        <div class="settingsText">
            Audio is generated by the server and played with
            HTML5 audio when supported by the browser.
        </div>

        <input
            type="button"
            id="closeSettings"
            value="Close"
        >
    </div>

    <div id="world"></div>

    <div id="taskbar">
        <input
            type="button"
            id="startButton"
            value="Start"
        >

        <input
            type="text"
            id="messageInput"
            maxlength="500"
        >
    </div>

</div>

<div id="audio"></div>

<script type="text/javascript" src="/script.js"></script>

</body>
</html>
