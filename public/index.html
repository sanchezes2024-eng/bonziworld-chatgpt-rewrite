<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat Desktop</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>


    <!-- ==================================================
         LOGIN SCREEN
    =================================================== -->

    <div id="loginScreen">

        <div class="loginBox">

            <h1>Chat</h1>


            <input
                id="nameInput"
                type="text"
                placeholder="Your name"
                maxlength="30"
                autocomplete="off"
            >


            <input
                id="roomInput"
                type="text"
                value="default"
                placeholder="Room ID"
                maxlength="50"
                autocomplete="off"
            >


            <button id="submitButton">
                Submit
            </button>

        </div>
        <a
            id="readmeLink"
            href="/readme.html"
        >
            README
        </a>
    </div>


    <!-- ==================================================
         DESKTOP
    =================================================== -->

    <div id="desktop">

        <div id="settingsButton">⚙ Settings</div>

        <div id="settingsPanel">
            <div class="settingsTitle">Settings</div>

            <label>
                <input
                    type="radio"
                    name="ttsMode"
                    value="browser"
                    checked
                >
                Browser TTS
            </label>

            <label>
                <input
                    type="radio"
                    name="ttsMode"
                    value="espeak"
                >
                eSpeak
            </label>

            <button id="closeSettings">
                Close
            </button>
        </div>
        <!-- WORLD -->

        <div id="world"></div>


        <!-- ==================================================
             TASKBAR
        =================================================== -->

        <div id="taskbar">


            <button id="startButton">
                Start
            </button>


            <input
                id="messageInput"
                type="text"
                placeholder="Type a message..."
                maxlength="300"
                autocomplete="off"
            >


        </div>


    </div>


    <!-- ==================================================
         SOCKET.IO
    =================================================== -->

    <div id="audio"></div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="/speakClient.js"></script>
    <script src="/script.js"></script>


</body>

</html>
